name: Collecte quotidienne

on:
  schedule:
    - cron: "0 12 * * *" # 7 h à Montréal (heure normale), 8 h l'été
  workflow_dispatch: {} # bouton « Run workflow » pour lancer à la main

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur pour les visuels
        run: npx playwright install --with-deps chromium
      - name: Collecte Europe + US/CA, classement, visuels
        run: npm run daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v27.0
          META_COUNTRIES: FR,DE,NL,BE,ES,IT,SE,DK,IE,AT,GB
          META_MAX_PER_TERM: "500"
          CLASSIFY_MODE: rules
          MEDIA_LIMIT: "250"
          PAGE_LIMIT: "150"
          VIDEO_LIMIT: "200"
          CLEANUP_DAYS: "30"
          LIB_COUNTRIES: US,CA
          LIB_MEDIA_TYPES: all,video,image
          LIB_MAX_PER_TERM: "200"
          LIB_MEDIA_LIMIT: "400"
